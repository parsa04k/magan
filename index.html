<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجله صنایع - فلیپ‌بوک راست‌به‌چپ</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        #flipbook-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            display: none;
            background: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            overflow: hidden;
        }

        /* ============================================================
           ①  کل کتاب آینه می‌شود  →  کتاب فارسی (راست‌به‌چپ) می‌شود
           ============================================================ */
        #flipbook {
            direction: ltr;              /* چیدمان داخلی کتابخانه همیشه LTR است */
            transform: scaleX(-1);       /* آینه کردن کل کتاب */
            transform-origin: center center;
        }

        /* ============================================================
           ②  محتوای هر صفحه دوباره آینه می‌شود  →  وارونه نشود
           ============================================================ */
        .my-page {
            background: #fff;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .my-page .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scaleX(-1);       /* برگرداندن محتوا به حالت درست */
        }

        .my-page canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #loading {
            font-size: 1.1rem;
            color: #ecf0f1;
            text-align: center;
            margin: 30px 0;
        }

        #error {
            display: none;
            color: #ffd5d5;
            text-align: center;
            max-width: 600px;
            line-height: 2;
        }

        .controls {
            display: none;
            margin-top: 25px;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .controls button:hover:not(:disabled) { background: #2980b9; }
        .controls button:active:not(:disabled) { transform: scale(0.97); }

        .controls button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #page-counter {
            min-width: 110px;
            text-align: center;
            font-size: 0.95rem;
            color: #ecf0f1;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            #flipbook-container { max-width: 100%; }
            .controls { gap: 8px; margin-top: 15px; }
            .controls button { padding: 10px 14px; font-size: 0.9rem; }
        }
    </style>
</head>

<body>

    <div id="loading">
        در حال بارگذاری مجله، لطفاً شکیبا باشید...
    </div>

    <div id="error"></div>

    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>

    <div class="controls" id="nav-controls">
        <button id="btn-next" type="button">صفحه بعد ←</button>
        <span id="page-counter">صفحه ۱</span>
        <button id="btn-prev" type="button">→ صفحه قبل</button>
    </div>

    <script>
        // فایل PDF باید در کنار فایل HTML باشد.
        const PDF_URL = 'magazine.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pageFlip = null;
        let totalPages = 0;

        const loadingElement   = document.getElementById('loading');
        const errorElement     = document.getElementById('error');
        const containerElement = document.getElementById('flipbook-container');
        const flipbookElement  = document.getElementById('flipbook');
        const controlsElement  = document.getElementById('nav-controls');
        const previousButton   = document.getElementById('btn-prev');
        const nextButton       = document.getElementById('btn-next');
        const pageCounter      = document.getElementById('page-counter');

        function toPersianNumber(value) {
            return String(value).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
        }

        function showError(message) {
            loadingElement.style.display = 'none';
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        async function loadFlipbook() {
            try {
                const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
                totalPages = pdf.numPages;

                flipbookElement.innerHTML = '';

                // ترتیب اصلی صفحات PDF حفظ می‌شود
                for (let i = 1; i <= totalPages; i++) {
                    const pdfPage = await pdf.getPage(i);
                    const viewport = pdfPage.getViewport({ scale: 2 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    canvas.width  = viewport.width;
                    canvas.height = viewport.height;

                    await pdfPage.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // .my-page   → همان چیزی که کتابخانه جابه‌جا/چرخانده می‌کند
                    // .page-content → فقط برای برگرداندن آینه‌ی محتوا
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'my-page';

                    const content = document.createElement('div');
                    content.className = 'page-content';
                    content.appendChild(canvas);

                    pageDiv.appendChild(content);
                    flipbookElement.appendChild(pageDiv);
                }

                pageFlip = new St.PageFlip(flipbookElement, {
                    width: 600,
                    height: 848,
                    size: 'stretch',

                    minWidth: 280,
                    maxWidth: 800,
                    minHeight: 396,
                    maxHeight: 1131,

                    drawShadow: true,
                    flippingTime: 800,
                    usePortrait: true,
                    startPage: 0,
                    startZIndex: 0,
                    autoSize: true,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(
                    flipbookElement.querySelectorAll('.my-page')
                );

                pageFlip.on('flip', event => {
                    updateControls(event.data);
                });

                pageFlip.on('init', event => {
                    updateControls(event.data.page);
                });

                loadingElement.style.display = 'none';
                containerElement.style.display = 'block';
                controlsElement.style.display = 'flex';

                updateControls(0);

                requestAnimationFrame(() => {
                    if (pageFlip) pageFlip.update();
                });

            } catch (error) {
                console.error('Error loading flipbook:', error);

                showError(
                    'بارگذاری مجله ناموفق بود. مطمئن شوید فایل magazine.pdf ' +
                    'در مسیر صحیح قرار دارد و صفحه از طریق یک وب‌سرور اجرا می‌شود.'
                );
            }
        }

        function updateControls(currentIndex) {
            previousButton.disabled = currentIndex <= 0;
            nextButton.disabled     = currentIndex >= totalPages - 1;

            pageCounter.textContent =
                'صفحه ' + toPersianNumber(currentIndex + 1) +
                ' از '   + toPersianNumber(totalPages);
        }

        /*
          چون کل کتاب آینه شده است، خروجی بصری این توابع
          دقیقاً مثل کتاب فارسی است:
          flipNext()  → ورق از چپ به راست می‌رود (صفحه‌ی بعد)
          flipPrev()  → ورق از راست به چپ برمی‌گردد (صفحه‌ی قبل)
        */
        nextButton.addEventListener('click', () => {
            if (pageFlip && !nextButton.disabled) pageFlip.flipNext();
        });

        previousButton.addEventListener('click', () => {
            if (pageFlip && !previousButton.disabled) pageFlip.flipPrev();
        });

        window.addEventListener('resize', () => {
            if (pageFlip) pageFlip.update();
        });

        window.addEventListener('load', loadFlipbook);
    </script>
</body>
</html>
